# Plataforma Completa: GameStats (Go + Scala) + GameConsole (Web POO) + Gato AI (Prolog)
#
#   docker compose up --build                       # Levanta todo el ecosistema
#   docker compose --profile sim run --rm simulator # Simula partidas de prueba (opcional)
#   docker compose down                             # Apagar servicios

services:
  scala:
    build: ./scala
    environment:
      PORT: "9090"
      OUTPUT_DIR: /data/results
    volumes:
      - ./output:/data/results
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  go:
    build:
      context: .
      target: server
    environment:
      PORT: "8080"
      SCALA_URL: http://scala:9090
    ports:
      - "8080:8080"
    depends_on:
      scala:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gato-ai:
    build:
      context: ./prolog-ai
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped

  game-console:
    build:
      context: ./game-console
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      go:
        condition: service_healthy
      gato-ai:
        condition: service_started
    restart: unless-stopped

  simulator:
    build:
      context: .
      target: simulator
    command: ["-url", "http://go:8080/events"]
    depends_on:
      go:
        condition: service_healthy
    profiles: ["sim"]
