name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  scala:
    name: Scala (sbt test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch test

  docker:
    name: Docker (build + prueba de integracion)
    needs: [go, scala]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar Go + Scala
        run: docker compose up -d --build --wait
      - name: Enviar eventos del simulador
        run: docker compose --profile sim run --rm simulator
      - name: Verificar que las 5 partidas queden analizadas
        run: |
          for i in $(seq 1 30); do
            n=$(curl -s localhost:8080/matches | grep -o '"status":"analyzed"' | wc -l)
            if [ "$n" -eq 5 ]; then echo "OK: 5 partidas analizadas"; exit 0; fi
            sleep 2
          done
          echo "Fallo: no se analizaron las 5 partidas"
          curl -s localhost:8080/matches
          exit 1
      - name: Logs (solo si falla)
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v
